ste finde. ¡Cuenten conmigo!"},{id:"s_sl_vault_8",en:"Count me in.",meaning:"include me; I want to join",es:"Inclúyanme. / Yo también me apunto.",en_ex:"Road trip to Vegas? Count me in!",es_ex:"¿Viaje por carretera a Vegas? ¡Inclúyanme!"},{id:"s_sl_vault_9",en:"My bad.",meaning:"my mistake; sorry",es:"Mi culpa. / Perdón. / Fallo mío.",en_ex:"My bad, I forgot to text you.",es_ex:"Mi culpa, olvidé escribirte."},{id:"s_sl_vault_10",en:"I'm good.",meaning:"I'm fine / no thanks, I don't need anything",es:"Estoy bien. / No gracias, así estoy.",en_ex:"Do you want more food? Nah, I'm good.",es_ex:"¿Quieres más comida? No, estoy bien así."},{id:"s_sl_vault_11",en:"No worries.",meaning:"it's okay; don't worry about it",es:"Sin problema. / No te preocupes. / Todo bien.",en_ex:"Sorry I'm late! No worries, we just started.",es_ex:"¡Perdón por llegar tarde! No te preocupes, acabamos de empezar."},{id:"s_sl_vault_12",en:"Give me a sec.",meaning:"wait a moment",es:"Dame un segundo. / Un momento.",en_ex:"Give me a sec, I'm almost ready.",es_ex:"Dame un segundo, casi estoy listo."},{id:"s_sl_vault_13",en:"Hang on.",meaning:"wait",es:"Espera. / Aguanta un momento.",en_ex:"Hang on, let me check my phone.",es_ex:"Espera, déjame revisar el teléfono."},{id:"s_sl_vault_14",en:"Go for it.",meaning:"do it; try it",es:"Hazlo. / Adelante. / ¡Ve por ello!",en_ex:"Should I ask her out? Go for it!",es_ex:"¿Debería invitarla? ¡Hazlo!"},{id:"s_sl_vault_15",en:"I'm all set.",meaning:"everything is taken care of; I'm ready",es:"Ya estoy listo/a. / Todo en orden.",en_ex:"You need anything else? Nope, I'm all set.",es_ex:"¿Necesitas algo más? No, ya estoy lista."},{id:"s_sl_vault_16",en:"Hear me out.",meaning:"listen to my whole idea first",es:"Escúchame primero. / Déjame terminar.",en_ex:"Hear me out before you say no.",es_ex:"Escúchame antes de decir que no."},{id:"s_sl_vault_17",en:"Keep me posted.",meaning:"keep me updated",es:"Mantenme al tanto. / Avísame.",en_ex:"Let me know how the interview goes. Keep me posted!",es_ex:"Cuéntame cómo va la entrevista. ¡Mantenme al tanto!"},{id:"s_sl_vault_18",en:"I'm beat.",meaning:"I'm extremely tired",es:"Estoy agotado/a. / Estoy muerto/a de cansancio.",en_ex:"I worked 12 hours today. I'm beat.",es_ex:"Trabajé 12 horas hoy. Estoy agotada."},{id:"s_sl_vault_19",en:"I'm wiped out.",meaning:"I'm completely exhausted",es:"Estoy hecho/a polvo. / Agotado/a por completo.",en_ex:"After that hike, I'm totally wiped out.",es_ex:"Después de esa caminata, estoy hecho polvo."},{id:"s_sl_vault_20",en:"I'm pumped.",meaning:"I'm excited and energized",es:"Estoy emocionado/a. / Estoy cargado/a de energía.",en_ex:"The game is tonight. I'm so pumped!",es_ex:"El partido es esta noche. ¡Estoy muy emocionado!"},{id:"s_sl_vault_21",en:"I'm stoked.",meaning:"I'm extremely excited",es:"Estoy súper emocionado/a. / Emocionadísimo/a.",en_ex:"We got tickets to the show. I'm stoked!",es_ex:"Conseguimos entradas para el show. ¡Estoy emocionadísima!"},{id:"s_sl_vault_22",en:"What's going on?",meaning:"what's happening?",es:"¿Qué está pasando? / ¿Qué onda?",en_ex:"I heard yelling. What's going on in there?",es_ex:"Escuché gritos. ¿Qué está pasando ahí adentro?"},{id:"s_sl_vault_23",en:"What's the deal?",meaning:"what's happening? what's the issue?",es:"¿De qué se trata? / ¿Cuál es el rollo?",en_ex:"You've been quiet all day. What's the deal?",es_ex:"Has estado callado todo el día. ¿Cuál es el rollo?"},{id:"s_sl_vault_24",en:"Let me think.",meaning:"I need a moment to consider that",es:"Déjame pensar. / Dame un momento.",en_ex:"What should we order? Let me think…",es_ex:"¿Qué pedimos? Déjame pensar..."},{id:"s_sl_vault_25",en:"Off the top of my head.",meaning:"without thinking deeply first",es:"Así de memoria. / Sin pensarlo mucho.",en_ex:"Off the top of my head, I'd say around 50 people.",es_ex:"Así de memoria, diría que unas 50 personas."},{id:"s_sl_vault_26",en:"To be honest...",meaning:"I'm going to tell you what I really think",es:"Para ser honesto/a... / La verdad es que...",en_ex:"To be honest, I didn't really like the movie.",es_ex:"Para ser honesta, la película no me gustó mucho."},{id:"s_sl_vault_27",en:"Fair enough.",meaning:"I understand and accept your point",es:"Está bien. / Me parece justo.",en_ex:"I can't make it Saturday. Fair enough, no worries.",es_ex:"No puedo el sábado. Está bien, no hay problema."},{id:"s_sl_vault_28",en:"Good point.",meaning:"that's a valid argument",es:"Buen punto. / Tienes razón en eso.",en_ex:"We should leave early. Good point, traffic is bad.",es_ex:"Deberíamos salir temprano. Buen punto, el tráfico está pesado."},{id:"s_sl_vault_29",en:"No doubt.",meaning:"definitely; absolutely",es:"Sin duda. / Claro que sí.",en_ex:"She's the best player on the team. No doubt.",es_ex:"Es la mejor jugadora del equipo. Sin duda."},{id:"s_sl_vault_30",en:"I doubt it.",meaning:"I don't think that's likely",es:"Lo dudo. / No creo.",en_ex:"You think he'll show up? I doubt it.",es_ex:"¿Crees que va a aparecer? Lo dudo."},{id:"s_sl_vault_31",en:"Not really.",meaning:"not exactly; kind of no",es:"No exactamente. / La verdad no.",en_ex:"Do you like jazz? Not really.",es_ex:"¿Te gusta el jazz? La verdad no mucho."},{id:"s_sl_vault_32",en:"I don't buy it.",meaning:"I don't believe it",es:"No me lo creo. / No me convence.",en_ex:"He said he was stuck in traffic. I don't buy it.",es_ex:"Dijo que estaba atascado en el tráfico. No me lo creo."},{id:"s_sl_vault_33",en:"Sounds about right.",meaning:"that seems correct",es:"Suena correcto. / Parece que sí.",en_ex:"Is it about an hour away? Sounds about right.",es_ex:"¿Está como a una hora? Suena correcto."},{id:"s_sl_vault_34",en:"Makes sense.",meaning:"that seems logical",es:"Tiene sentido. / Lógico.",en_ex:"We should study before the test. Makes sense!",es_ex:"Deberíamos estudiar antes del examen. ¡Tiene sentido!"},{id:"s_sl_vault_35",en:"I get it.",meaning:"I understand",es:"Lo entiendo. / Ya capto.",en_ex:"Repeat that slowly. Now I get it!",es_ex:"Re   @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100%;position:relative}
  ::-webkit-scrollbar{width:3px;height:3px}
  ::-webkit-scrollbar-track{background:#03010a}
  ::-webkit-scrollbar-thumb{background:#44406a;border-radius:2px}

  @keyframes nebula-a{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(40px,-30px) scale(1.15) rotate(8deg)}}
  @keyframes nebula-b{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(-30px,40px) scale(1.1) rotate(-6deg)}}
  @keyframes nebula-c{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,20px) scale(1.08)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes rippleOut{0%{transform:scale(0.85);opacity:0.9}100%{transform:scale(2.4);opacity:0}}
  @keyframes glowPulse{0%,100%{opacity:0.7}50%{opacity:1}}
  @keyframes flipIn{0%{transform:rotateY(-90deg);opacity:0}100%{transform:rotateY(0deg);opacity:1}}
  @keyframes rainbowShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
  @keyframes legendaryPulse{0%,100%{box-shadow:0 0 12px #FFD700,0 0 24px #FFD70050}50%{box-shadow:0 0 24px #FFD700,0 0 48px #FFD700}}
  @keyframes waveBar{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}
  @keyframes knownPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes ratePop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes chromab{0%,100%{text-shadow:none}33%{text-shadow:-3px 0 #ff00ff,3px 0 #00e5ff}66%{text-shadow:3px 0 #ff00ff,-3px 0 #00ff88}}
  @keyframes bioGlow{0%,100%{box-shadow:0 0 8px #00ff8844,0 0 16px #00ff8822}50%{box-shadow:0 0 24px #00ff8899,0 0 48px #00ff8855}}
  @keyframes starPulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(2)}}
  @keyframes recPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
  @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .lang-card{
    position:relative;
    display:flex;flex-direction:column;gap:5px;padding:14px 12px 11px;
    background:rgba(14,12,26,0.75);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(199,125,255,0.18);
    border-radius:20px;cursor:pointer;user-select:none;overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease,transform .12s ease;
    animation:fadeUp .3s ease both;
    -webkit-tap-highlight-color:transparent;
    min-height:155px;
  }
  .lang-card:hover{border-color:var(--cc);transform:translateY(-3px) scale(1.015);box-shadow:0 14px 36px rgba(0,0,0,0.6),0 0 20px var(--cc)22}
  .lang-card:active{transform:scale(0.93)}
  .lang-card.flipped{animation:flipIn .22s ease both}
  .lang-card.god-mode{animation:legendaryPulse 2s ease-in-out infinite,fadeUp .3s ease both!important;border-color:#FFD700!important}
  .lang-card.known-glow{border-color:rgba(0,255,136,0.35)!important;box-shadow:0 0 14px rgba(0,255,136,0.12)!important}
  .card-glow{position:absolute;inset:0;border-radius:19px;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,var(--cd) 0%,transparent 65%);opacity:0;transition:opacity .2s}
  .lang-card:hover .card-glow,.lang-card.flipped .card-glow{opacity:1}
  .ripple-ring{position:absolute;inset:0;border-radius:19px;border:2px solid var(--cc);pointer-events:none;animation:rippleOut .9s ease-out infinite}

  .card-action-row{display:flex;gap:4px;margin-top:auto;padding-top:6px;width:100%}
  .card-audio-btn{
    flex-shrink:0;padding:5px 8px;border-radius:8px;
    border:1px solid rgba(199,125,255,0.15);background:rgba(14,12,26,0.5);
    color:#44406a;cursor:pointer;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;min-width:32px;
  }
  .card-audio-btn.playing{border-color:var(--cc)!important;background:var(--cd)!important;color:var(--cc)!important;box-shadow:0 0 10px var(--cg)!important}
  .card-rate-btn{
    flex:1;padding:5px 3px;border-radius:8px;
    border:1px solid rgba(199,125,255,0.1);background:rgba(14,12,26,0.4);
    color:#44406a;cursor:pointer;font-size:12px;font-weight:800;
    font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;
    animation:ratePop .2s ease both;
  }
  .card-rate-btn.yes{border-color:#00FF8860!important;background:rgba(0,255,136,0.14)!important;color:#00FF88!important;box-shadow:0 0 8px rgba(0,255,136,0.25)!important}
  .card-rate-btn.no{border-color:rgba(255,0,107,0.4)!important;background:rgba(255,0,107,0.09)!important;color:#ff006b!important}

  .tab-pill{display:flex;align-items:center;gap:5px;padding:9px 15px;border-radius:50px;border:1.5px solid #27254a;background:rgba(14,12,26,0.5);color:#44406a;font-size:12.5px;font-weight:800;font-family:inherit;white-space:nowrap;cursor:pointer;transition:all .18s ease;-webkit-tap-highlight-color:transparent;outline:none}
  .tab-pill:hover:not(.active){border-color:var(--tc);color:var(--tc)}
  .tab-pill.active{background:var(--tc)22;border-color:var(--tc);color:var(--tc);box-shadow:0 0 14px var(--tg)}
  .cnt-badge{padding:1px 7px;border-radius:20px;font-size:11px;font-weight:900;background:rgba(0,0,0,0.3);transition:background .18s}
  .tab-pill.active .cnt-badge{background:rgba(255,255,255,0.2)}
  .bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 4px;font-family:inherit;transition:transform .12s;-webkit-tap-highlight-color:transparent;outline:none}
  .bottom-nav-btn:active{transform:scale(0.9)}
  .mode-toggle-btn{padding:8px 18px;border-radius:50px;border:1.5px solid #27254a;background:rgba(14,12,26,0.5);color:#44406a;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;outline:none;white-space:nowrap}
  .mode-toggle-btn.active{background:var(--mc)22;border-color:var(--mc);color:var(--mc);box-shadow:0 0 12px var(--mg)}
