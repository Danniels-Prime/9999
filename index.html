te finde. ¡Cuenten conmigo!"},{id:"s_sl_vault_8",en:"Count me in.",meaning:"include me; I want to join",es:"Inclúyanme. / Yo también me apunto.",en_ex:"Road trip to Vegas? Count me in!",es_ex:"¿Viaje por carretera a Vegas? ¡Inclúyanme!"},{id:"s_sl_vault_9",en:"My bad.",meaning:"my mistake; sorry",es:"Mi culpa. / Perdón. / Fallo mío.",en_ex:"My bad, I forgot to text you.",es_ex:"Mi culpa, olvidé escribirte."},{id:"s_sl_vault_10",en:"I'm good.",meaning:"I'm fine / no thanks, I don't need anything",es:"Estoy bien. / No gracias, así estoy.",en_ex:"Do you want more food? Nah, I'm good.",es_ex:"¿Quieres más comida? No, estoy bien así."},{id:"s_sl_vault_11",en:"No worries.",meaning:"it's okay; don't worry about it",es:"Sin problema. / No te preocupes. / Todo bien.",en_ex:"Sorry I'm late! No worries, we just started.",es_ex:"¡Perdón por llegar tarde! No te preocupes, acabamos de empezar."},{id:"s_sl_vault_12",en:"Give me a sec.",meaning:"wait a moment",es:"Dame un segundo. / Un momento.",en_ex:"Give me a sec, I'm almost ready.",es_ex:"Dame un segundo, casi estoy listo."},{id:"s_sl_vault_13",en:"Hang on.",meaning:"wait",es:"Espera. / Aguanta un momento.",en_ex:"Hang on, let me check my phone.",es_ex:"Espera, déjame revisar el teléfono."},{id:"s_sl_vault_14",en:"Go for it.",meaning:"do it; try it",es:"Hazlo. / Adelante. / ¡Ve por ello!",en_ex:"Should I ask her out? Go for it!",es_ex:"¿Debería invitarla? ¡Hazlo!"},{id:"s_sl_vault_15",en:"I'm all set.",meaning:"everything is taken care of; I'm ready",es:"Ya estoy listo/a. / Todo en orden.",en_ex:"You need anything else? Nope, I'm all set.",es_ex:"¿Necesitas algo más? No, ya estoy lista."},{id:"s_sl_vault_16",en:"Hear me out.",meaning:"listen to my whole idea first",es:"Escúchame primero. / Déjame terminar.",en_ex:"Hear me out before you say no.",es_ex:"Escúchame antes de decir que no."},{id:"s_sl_vault_17",en:"Keep me posted.",meaning:"keep me updated",es:"Mantenme al tanto. / Avísame.",en_ex:"Let me know how the interview goes. Keep me posted!",es_ex:"Cuéntame cómo va la entrevista. ¡Mantenme al tanto!"},{id:"s_sl_vault_18",en:"I'm beat.",meaning:"I'm extremely tired",es:"Estoy agotado/a. / Estoy muerto/a de cansancio.",en_ex:"I worked 12 hours today. I'm beat.",es_ex:"Trabajé 12 horas hoy. Estoy agotada."},{id:"s_sl_vault_19",en:"I'm wiped out.",meaning:"I'm completely exhausted",es:"Estoy hecho/a polvo. / Agotado/a por completo.",en_ex:"After that hike, I'm totally wiped out.",es_ex:"Después de esa caminata, estoy hecho polvo."},{id:"s_sl_vault_20",en:"I'm pumped.",meaning:"I'm excited and energized",es:"Estoy emocionado/a. / Estoy cargado/a de energía.",en_ex:"The game is tonight. I'm so pumped!",es_ex:"El partido es esta noche. ¡Estoy muy emocionado!"},{id:"s_sl_vault_21",en:"I'm stoked.",meaning:"I'm extremely excited",es:"Estoy súper emocionado/a. / Emocionadísimo/a.",en_ex:"We got tickets to the show. I'm stoked!",es_ex:"Conseguimos entradas para el show. ¡Estoy emocionadísima!"},{id:"s_sl_vault_22",en:"What's going on?",meaning:"what's happening?",es:"¿Qué está pasando? / ¿Qué onda?",en_ex:"I heard yelling. What's going on in there?",es_ex:"Escuché gritos. ¿Qué está pasando ahí adentro?"},{id:"s_sl_vault_23",en:"What's the deal?",meaning:"what's happening? what's the issue?",es:"¿De qué se trata? / ¿Cuál es el rollo?",en_ex:"You've been quiet all day. What's the deal?",es_ex:"Has estado callado todo el día. ¿Cuál es el rollo?"},{id:"s_sl_vault_24",en:"Let me think.",meaning:"I need a moment to consider that",es:"Déjame pensar. / Dame un momento.",en_ex:"What should we order? Let me think…",es_ex:"¿Qué pedimos? Déjame pensar..."},{id:"s_sl_vault_25",en:"Off the top of my head.",meaning:"without thinking deeply first",es:"Así de memoria. / Sin pensarlo mucho.",en_ex:"Off the top of my head, I'd say around 50 people.",es_ex:"Así de memoria, diría que unas 50 personas."},{id:"s_sl_vault_26",en:"To be honest...",meaning:"I'm going to tell you what I really think",es:"Para ser honesto/a... / La verdad es que...",en_ex:"To be honest, I didn't really like the movie.",es_ex:"Para ser honesta, la película no me gustó mucho."},{id:"s_sl_vault_27",en:"Fair enough.",meaning:"I understand and accept your point",es:"Está bien. / Me parece justo.",en_ex:"I can't make it Saturday. Fair enough, no worries.",es_ex:"No puedo el sábado. Está bien, no hay problema."},{id:"s_sl_vault_28",en:"Good point.",meaning:"that's a valid argument",es:"Buen punto. / Tienes razón en eso.",en_ex:"We should leave early. Good point, traffic is bad.",es_ex:"Deberíamos salir temprano. Buen punto, el tráfico está pesado."},{id:"s_sl_vault_29",en:"No doubt.",meaning:"definitely; absolutely",es:"Sin duda. / Claro que sí.",en_ex:"She's the best player on the team. No doubt.",es_ex:"Es la mejor jugadora del equipo. Sin duda."},{id:"s_sl_vault_30",en:"I doubt it.",meaning:"I don't think that's likely",es:"Lo dudo. / No creo.",en_ex:"You think he'll show up? I doubt it.",es_ex:"¿Crees que va a aparecer? Lo dudo."},{id:"s_sl_vault_31",en:"Not really.",meaning:"not exactly; kind of no",es:"No exactamente. / La verdad no.",en_ex:"Do you like jazz? Not really.",es_ex:"¿Te gusta el jazz? La verdad no mucho."},{id:"s_sl_vault_32",en:"I don't buy it.",meaning:"I don't believe it",es:"No me lo creo. / No me convence.",en_ex:"He said he was stuck in traffic. I don't buy it.",es_ex:"Dijo que estaba atascado en el tráfico. No me lo creo."},{id:"s_sl_vault_33",en:"Sounds about right.",meaning:"that seems correct",es:"Suena correcto. / Parece que sí.",en_ex:"Is it about an hour away? Sounds about right.",es_ex:"¿Está como a una hora? Suena correcto."},{id:"s_sl_vault_34",en:"Makes sense.",meaning:"that seems logical",es:"Tiene sentido. / Lógico.",en_ex:"We should study before the test. Makes sense!",es_ex:"Deberíamos estudiar antes del examen. ¡Tiene sentido!"},{id:"s_sl_vault_35",en:"I get it.",meaning:"I understand",es:"Lo entiendo. / Ya capto.",en_ex:"Repeat that slowly. Now I get it!",es_ex:"Repítelo despacio. ¡Ahora lo entiendo!"},{id:"s_sl_vault_36",en:"Got it.",meaning:"I understand and will remember",es:"Entendido. / Captado.",en_ex:"Meet at the corner at 8. Got it!",es_ex:"En la esquina a las 8. ¡Entendido!"},{id:"s_sl_vault_37",en:"You bet.",meaning:"of course; absolutely yes",es:"Por supuesto. / Claro que sí.",en_ex:"Would you do it again? You bet!",es_ex:"¿Lo harías de nuevo? ¡Por supuesto!"},{id:"s_sl_vault_38",en:"You never know.",meaning:"anything is possible",es:"Nunca se sabe. / Todo puede pasar.",en_ex:"Do you think we'll win? You never know!",es_ex:"¿Crees que vamos a ganar? ¡Nunca se sabe!"},{id:"s_sl_vault_39",en:"Time will tell.",meaning:"the future will reveal the answer",es:"El tiempo lo dirá. / Ya veremos con el tiempo.",en_ex:"Is it a good investment? Time will tell.",es_ex:"¿Es una buena inversión? El tiempo lo dirá."},{id:"s_sl_vault_40",en:"We'll see.",meaning:"I'm not sure yet",es:"Ya veremos. / El tiempo dirá.",en_ex:"Will you come to the party? We'll see.",es_ex:"¿Vendrás a la fiesta? Ya veremos."},{id:"s_sl_vault_41",en:"It depends.",meaning:"the answer varies by circumstance",es:"Depende. / Según y cómo.",en_ex:"Is it expensive? It depends on where you go.",es_ex:"¿Es caro? Depende de a dónde vayas."},{id:"s_sl_vault_42",en:"That's true.",meaning:"I agree that's correct",es:"Es verdad. / Tienes razón.",en_ex:"Rent is expensive here. That's true.",es_ex:"El alquiler aquí es caro. Es verdad."},{id:"s_sl_vault_43",en:"You have a point.",meaning:"your argument is valid",es:"Tienes razón en eso. / Buen punto.",en_ex:"Maybe we should wait. You have a point.",es_ex:"Quizás debemos esperar. Tienes razón en eso."},{id:"s_sl_vault_44",en:"That's a good question.",meaning:"I need to think about that",es:"Buena pregunta.",en_ex:"Why does the sky turn red at sunset? That's a good question.",es_ex:"¿Por qué el cielo se pone rojo al atardecer? Buena pregunta."},{id:"s_sl_vault_45",en:"For real?",meaning:"really? is that true?",es:"¿En serio? t situation",es:"Salir adelante. / Superarlo. / Tirar para adelante.",en_ex:"She had a tough recovery but she pulled through.",es_ex:"Tuvo una recuperación difícil pero salió adelante."},{id:"s_sl_vault_189",en:"Bear with me.",meaning:"be patient with me",es:"Ten paciencia conmigo. / Aguántame un momento.",en_ex:"Bear with me — I'm still figuring this out.",es_ex:"Ten paciencia conmigo — todavía lo estoy entendiendo."},{id:"s_sl_vault_190",en:"Give it a shot.",meaning:"to try something",es:"Intentarlo. / Darle una oportunidad.",en_ex:"You should give it a shot — you might love it!",es_ex:"¡Deberías intentarlo — puede que te encante!"},{id:"s_sl_vault_191",en:"Figure it out.",meaning:"to find a solution; to understand something",es:"Resolverlo. / Arreglárselas. / Entenderlo.",en_ex:"I don't know how yet, but I'll figure it out.",es_ex:"Aún no sé cómo, pero lo resolveré."},{id:"s_sl_vault_192",en:"Rise and shine.",meaning:"wake up and be ready to start the day",es:"¡Arriba! / ¡A levantarse! / ¡Buenos días y a moverse!",en_ex:"Rise and shine — we've got a big day ahead!",es_ex:"¡Arriba! — ¡Nos espera un día importante!"},{id:"s_sl_vault_193",en:"Touch base.",meaning:"to briefly communicate or check in",es:"Ponerse en contacto. / Hacer un chequeo rápido.",en_ex:"Let's touch base next week to see how it's going.",es_ex:"Contactemos la semana que viene para ver cómo va."},{id:"s_sl_vault_194",en:"Play it by ear.",meaning:"to improvise; decide as you go",es:"Improvisar. / Ver cómo va saliendo.",en_ex:"I don't have a plan yet — let's just play it by ear.",es_ex:"Aún no tengo plan — vamos viendo cómo va saliendo."},{id:"s_sl_vault_195",en:"Take it easy.",meaning:"relax; don't stress; goodbye",es:"Tómatelo con calma. / Relájate. / Hasta luego.",en_ex:"You've worked hard today — take it easy tonight.",es_ex:"Has trabajado mucho hoy — tómatelo con calma esta noche."},{id:"s_sl_vault_196",en:"Keep your chin up.",meaning:"stay positive during a hard time",es:"Mantén el ánimo. / N  IDIOMS & EXPRESSIONS"},sl_vault:Np},at={survival:[{id:"p_survival_0",en:"Yes",meaning:"affirmative answer; agreement",es:"Sí",en_ex:"Yes, I understand.",es_ex:"Sí, entiendo."},{id:"p_survival_1",en:"No",meaning:"negative answer; refusal",es:"No",en_ex:"No, thank you.",es_ex:"No, gracias."},{id:"p_survival_2",en:"Please",meaning:"polite word used when asking for something",es:"Por favor",en_ex:"Give me this, please.",es_ex:"Dame esto, por favor."},{id:"p_survival_3",en:"Thank you",meaning:"expressing gratitude toward someone",es:"Gracias",en_ex:"Thank you very much!",es_ex:"¡Muchas gracias!"},{id:"p_survival_4",en:"You're welcome",meaning:"polite response when someone thanks you",es:"De nada",en_ex:"You're welcome, don't worry.",es_ex:"De nada, no te preocupes."},{id:"p_survival_5",en:"Sorry / Excuse me",meaning:"apologizing or politely getting someone's attention",es:"Perdón / Disculpe",en_ex:"Sorry, I didn't understand.",es_ex:"Perdón, no entendí."},{id:"p_survival_6",en:"I don't understand",meaning:"saying something is not clear to you",es:"No entiendo",en_ex:"I don't understand Spanish.",es_ex:"No entiendo español."},{id:"p_survival_7",en:"Do you speak English?",meaning:"asking if someone can communicate in English",es:"¿Hablas inglés?",en_ex:"Do you speak English?",es_ex:"¿Hablas inglés?"},{id:"p_survival_8",en:"Help!",meaning:"urgent call for assistance in danger",es:"¡Ayuda!",en_ex:"Help me, please!",es_ex:"¡Ayúdame, por favor!"},{id:"p_survival_9",en:"I need a doctor",meaning:"requesting urgent medical assistance",es:"Necesito un médico",en_ex:"I urgently need a doctor.",es_ex:"Necesito un médico urgentemente."},{id:"p_survival_10",en:"Where is...?",meaning:"asking for the location of something",es:"¿Dónde está...?",en_ex:"Where is the bathroom?",es_ex:"¿Dónde está el baño?"},{id:"p_survival_11",en:"How much?",meaning:"asking for the price of something",es:"¿Cuánto cuesta?",en_ex:"How much does this cost?",es_ex:"¿Cuánto cuesta esto?"},{id:"p_survival_12",en:"I want",meaning:"expressing a desire or wish for something",es:"Quiero",en_ex:"I want water.",es_ex:"Quiero agua."},{id:"p_survival_13",en:"I need",meaning:"expressing that something is necessary",es:"Necesito",en_ex:"I need help.",es_ex:"Necesito ayuda."},{id:"p_survival_14",en:"Call the police",meaning:"requesting law enforcement in an emergency",es:"Llame a la policía",en_ex:"Please call the police!",es_ex:"¡Por favor, llame a la policía!"},{id:"p_survival_15",en:"I am lost",meaning:"saying you don't know where you are",es:"Estoy perdido",en_ex:"I got lost in the city.",es_ex:"Me perdí en la ciudad."},{id:"p_survival_16",en:"I am sick",meaning:"saying you feel ill or unwell",es:"Estoy enfermo",en_ex:"I am sick and feel bad.",es_ex:"Estoy enfermo y me siento mal."},{id:"p_survival_17",en:"Where is the hospital?",meaning:"asking for directions to a medical facility",es:"¿Dónde está el hospital?",en_ex:"Where is the nearest hospital?",es_ex:"¿Dónde está el hospital más cercano?"},{id:"p_survival_18",en:"Emergency",meaning:"a sudden serious situation requiring immediate action",es:"Emergencia",en_ex:"Call an ambulance!",es_ex:"¡Llame a una ambulancia!"},{id:"p_survival_19",en:"I don't speak Spanish",meaning:"explaining you cannot communicate in Spanish",es:"No hablo español",en_ex:"I don't speak Spanish, sorry.",es_ex:"No hablo español, lo siento."}],greetings:[{id:"p_greetings_0",en:"Hello",meaning:"universal greeting used any time of day",es:"Hola",en_ex:"Hi! How are you?",es_ex:"¡Hola! ¿Cómo estás?"},{id:"p_greetings_1",en:"Good morning",meaning:"greeting used in the morning hours",es:"Buenos días",en_ex:"Good morning! How did you sleep?",es_ex:"¡Buenos días! ¿Cómo dormiste?"},{id:"p_greetings_2",en:"Good afternoon",meaning:"greeting used during the afternoon",es:"Buenas tardes",en_ex:"Good afternoon! Nice to see you.",es_ex:"¡Buenas tardes! Qué gusto verte."},{id:"p_greetings_3",en:"Good evening",meaning:"greeting used in the evening or early night",es:"Buenas noches",en_ex:"Good evening! Have a seat.",es_ex:"¡Buenas noches! Toma asiento."},{id:"p_greetings_4",en:"Goodbye",meaning:"farewell said when parting from someone",es:"Adiós",en_ex:"Goodbye! See you tomorrow.",es_ex:"¡Adiós! Nos vemos mañana."},{id:"p_greetings_5",en:"Bye (informal)",meaning:"casual farewell used with friends and family",es:"Chao / Hasta luego",en_ex:"Bye! See you!",es_ex:"¡Chao! ¡Nos vemos!"},{id:"p_greetings_6",en:"How are you?",meaning:"asking about someone's general wellbeing",es:"¿Cómo estás?",en_ex:"How are you? Everything good?",es_ex:"¿Cómo estás? ¿Todo bien?"},{id:"p_greetings_7",en:"I'm fine",meaning:"saying you are doing well or in good health",es:"Estoy bien",en_ex:"Everything is fine, thank you!",es_ex:"¡Todo está bien, gracias!"},{id:"p_greetings_8",en:"What is your name?",meaning:"asking someone to tell you who they are",es:"¿Cómo te llamas?",en_ex:"What's your name? My name is Blake.",es_ex:"¿Cómo te llamas? Me llamo Blake."},{id:"p_greetings_9",en:"My name is...",meaning:"introducing yourself by stating your name",es:"Me llamo...",en_ex:"My name is Alexander.",es_ex:"Me llamo Alejandro."},{id:"p_greetings_10",en:"Nice to meet you",meaning:"polite expression when meeting someone for the first time",es:"Mucho gusto",en_ex:"Nice to meet you!",es_ex:"¡Mucho gusto en conocerte!"},{id:"p_greetings_11",en:"Where are you from?",meaning:"asking about someone's country or hometown of origin",es:"¿De dónde eres?",en_ex:"Where are you from? I'm from America.",es_ex:"¿De dónde eres? Soy de América."},{id:"p_greetings_12",en:"I am from...",meaning:"telling someone your country or place of origin",es:"Soy de...",en_ex:"I am from New York.",es_ex:"Soy de Nueva York."},{id:"p_greetings_13",en:"How old are you?",meaning:"asking about someone's age",es:"¿Cuántos años tienes?",en_ex:"How old are you? I am 25.",es_ex:"¿Cuántos años tienes? Tengo 25."},{id:"p_greetings_14",en:"See you later",meaning:"casual goodbye implying you will meet again soon",es: erspective",meaning:"introducing your personal viewpoint",es:"Desde mi perspectiva",en_ex:"From my perspective, communication is the key issue.",es_ex:"Desde mi perspectiva, la comunicación es el problema principal."},{id:"p_adv_conv_12",en:"What do you think about that?",meaning:"asking someone for their opinion on a topic",es:"¿Qué piensas de eso?",en_ex:"I've shared my opinion. What do you think about that?",es_ex:"He compartido mi opinión. ¿Qué piensas de eso?"},{id:"p_adv_conv_13",en:"I was about to say the same thing",meaning:"expressing that you had the same thought as someone else",es:"Estaba a punto de decir lo mismo",en_ex:"I was about to say the same thing before you interrupted me.",es_ex:"Estaba a punto de decir lo mismo antes de que me interrumpieras."},{id:"p_adv_conv_14",en:"That's easier said than done",meaning:"something sounds simple but is actually difficult to accomplish",es:"Es más fácil decirlo que hacerlo",en_ex:"Starting a business is easier said than done.",es_ex:"Empezar un negocio es más fácil decirlo que hacerlo."},{id:"p_adv_conv_15",en:"I completely understand",meaning:"showing empathy and full understanding",es:"Lo entiendo completamente",en_ex:"I completely understand why you're frustrated.",es_ex:"Entiendo completamente por qué estás frustrado."},{id:"p_adv_conv_16",en:"Let's get straight to the point",meaning:"suggesting that unnecessary details should be skipped",es:"Vayamos directo al grano",en_ex:"We're short on time, so let's get straight to the point.",es_ex:"Tenemos poco tiempo, así que vayamos directo al grano."},{id:"p_adv_conv_17",en:"I appreciate your honesty",meaning:"expressing gratitude for someone's truthful communication",es:"Aprecio tu honestidad",en_ex:"I appreciate your honesty, even if the truth is difficult to hear.",es_ex:"Aprecio tu honestidad, aunque la verdad sea difícil de escuchar."},{id:"p_adv_conv_18",en:"That's a fair question",meaning:"acknowledging that a question is reasonable and justified",es:"Es u g could happen",es:"Esa es una posibilidad",en_ex:"That's a possibility, but we need more evidence.",es_ex:"Esa es una posibilidad, pero necesitamos más evidencia."},{id:"p_adv_conv_35",en:"I couldn't help noticing",meaning:"saying that you naturally observed something",es:"No pude evitar notar",en_ex:"I couldn't help noticing that you seemed tired.",es_ex:"No pude evitar notar que parecías cansado."},{id:"p_adv_conv_36",en:"That's easier for you to say",meaning:"someone else's advice is easier because they are not in your situation",es:"Es fácil para ti decirlo",en_ex:"That's easier for you to say. You're not dealing with it.",es_ex:"Es fácil para ti decirlo. Tú no estás lidiando con ello."},{id:"p_adv_conv_37",en:"I appreciate the effort",meaning:"recognizing and valuing someone's attempt or hard work",es:"Aprecio el esfuerzo",en_ex:"Even though it failed, I appreciate the effort.",es_ex:"Aunque falló, aprecio el esfuerzo."},{id:"p_adv_conv_38",en:"For what it's worth",meaning:"offering an opinion that may or may not be useful",es:"Por lo que valga",en_ex:"For what it's worth, I think you're making the right choice.",es_ex:"Por lo que valga, creo que estás tomando la decisión correcta."},{id:"p_adv_conv_39",en:"I couldn't be happier",meaning:"expressing extreme happiness and satisfaction",es:"No podría estar más feliz",en_ex:"I couldn't be happier with the outcome.",es_ex:"No podría estar más feliz con el resultado."},{id:"p_adv_conv_40",en:"It wasn't my intention",meaning:"explaining that a result or action was not planned or meant to happen",es:"No era mi intención",en_ex:"It wasn't my intention to offend anyone.",es_ex:"No era mi intención ofender a nadie."},{id:"p_adv_conv_41",en:"Let's not jump to conclusions",meaning:"warning against making a decision before having enough information",es:"No saquemos conclusiones apresuradas",en_ex:"Let's not jump to conclusions until we know the facts.",es_ex:"No saquemos conclusiones apresuradas hasta conocer los hechos."} rfectly. I couldn't ask for more.",es_ex:"Todo salió perfectamente. No podría pedir más."},{id:"p_adv_conv_50",en:"As a matter of fact",meaning:"used to introduce a truthful or surprising piece of information",es:"De hecho",en_ex:"As a matter of fact, I already finished it.",es_ex:"De hecho, ya lo terminé."},{id:"p_adv_conv_51",en:"I couldn't care less",meaning:"expressing complete lack of interest",es:"No podría importarme menos",en_ex:"I couldn't care less about the rumors.",es_ex:"No podría importarme menos los rumores."},{id:"p_adv_conv_52",en:"That's a valid concern",meaning:"acknowledging that a worry or issue is reasonable",es:"Esa es una preocupación válida",en_ex:"That's a valid concern and we should address it.",es_ex:"Esa es una preocupación válida y deberíamos abordarla."},{id:"p_adv_conv_53",en:"I have no objection",meaning:"stating that you do not oppose an idea or action",es:"No tengo ninguna objeción",en_ex:"I have no objection to your proposal.",es_ex:"No tengo ninguna objeción a tu propuesta."},{id:"p_adv_conv_54",en:"That crossed my mind",meaning:"saying that you briefly thought about something",es:"Eso se me pasó por la mente",en_ex:"That crossed my mind, but I dismissed it.",es_ex:"Eso se me pasó por la mente, pero lo descarté."},{id:"p_adv_conv_55",en:"I wouldn't go that far",meaning:"partially disagreeing with a strong statement",es:"No llegaría tan lejos",en_ex:"I agree it's a problem, but I wouldn't go that far.",es_ex:"Estoy de acuerdo en que es un problema, pero no llegaría tan lejos."},{id:"p_adv_conv_56",en:"That's one way to look at it",meaning:"acknowledging an interpretation without fully agreeing",es:"Esa es una forma de verlo",en_ex:"That's one way to look at it, but there are others.",es_ex:"Esa es una forma de verlo, pero hay otras."},{id:"p_adv_conv_57",en:"I stand corrected",meaning:"admitting that you were wrong about something",es:"Reconozco mi error",en_ex:"I stand corrected. Your information was accurate.",es_ex:"Reconozco m _ex:"I disagree with that idea.",es_ex:"No estoy de acuerdo con esa idea."},{id:"p_opinion_2",en:"That's true",meaning:"acknowledging something as correct",es:"Eso es cierto",en_ex:"That's true.",es_ex:"Eso es cierto."},{id:"p_opinion_3",en:"Maybe you're right",meaning:"accepting a possibility",es:"Tal vez tengas razón",en_ex:"Maybe you're right about that.",es_ex:"Tal vez tengas razón sobre eso."},{id:"p_opinion_4",en:"It depends",meaning:"the answer changes according to circumstances",es:"Depende",en_ex:"It depends on the situation.",es_ex:"Depende de la situación."}],think:[{id:"p_think_0",en:"I don't think so",meaning:"believing something is probably not true",es:"No lo creo",en_ex:"Will it rain? I don't think so.",es_ex:"¿Lloverá? No lo creo."},{id:"p_think_1",en:"I hope so",meaning:"wanting something to happen",es:"Eso espero",en_ex:"Will they come? I hope so.",es_ex:"¿Vendrán? Eso espero."},{id:"p_think_2",en:"I hope not",meaning:"wanting something not to happen",es:"Espero que no",en_ex:"Will it fail? I hope not.",es_ex:"¿Fracasará? Espero que no."},{id:"p_think_3",en:"I guess so",meaning:"tentative agreement",es:"Supongo que sí",en_ex:"Should we go? I guess so.",es_ex:"¿Deberíamos ir? Supongo que sí."},{id:"p_think_4",en:"You're right",meaning:"admitting another person is correct",es:"Tienes razón",en_ex:"You're right about that.",es_ex:"Tienes razón en eso."}],questions:[{id:"p_questions_0",en:"What do you mean?",meaning:"asking for clarification",es:"¿Qué quieres decir?",en_ex:"What do you mean by that?",es_ex:"¿Qué quieres decir con eso?"},{id:"p_questions_1",en:"Why not?",meaning:"asking for a reason against something",es:"¿Por qué no?",en_ex:"Why not try it?",es_ex:"¿Por qué no intentarlo?"},{id:"p_questions_2",en:"What are you doing?",meaning:"asking about someone's current activity",es:"¿Qué estás haciendo?",en_ex:"What are you doing right now?",es_ex:"¿Qué estás haciendo ahora mismo?"},{id:"p_questions_3",en:"Where are you from?",meaning:"asking about someone's origin",es:"¿De dónde eres?",en_ex:"Where are you from originally?",es_ex:"¿De dónde eres originalmente?"},{id:"p_questions_4",en:"What do you think?",meaning:"asking for an opinion",es:"¿Qué piensas?",en_ex:"What do you think about it?",es_ex:"¿Qué piensas de eso?"}],react:[{id:"p_react_0",en:"That's awesome",meaning:"something is excellent or exciting",es:"Eso es increíble",en_ex:"That's awesome news!",es_ex:"¡Esa es una noticia increíble!"},{id:"p_react_1",en:"That's interesting",meaning:"finding something engaging",es:"Eso es interesante",en_ex:"That's interesting. Tell me more.",es_ex:"Eso es interesante. Cuéntame más."},{id:"p_react_2",en:"That's crazy",meaning:"something is surprising or extreme",es:"Eso es una locura",en_ex:"That's crazy!",es_ex:"¡Eso es una locura!"},{id:"p_react_3",en:"Good for you",meaning:"expressing approval or happiness for someone",es:"Me alegro por ti",en_ex:"You got the job? Good for you!",es_ex:"¿Conseguiste el trabajo? ¡Me alegro por ti!"},{id:"p_react_4",en:"Lucky you",meaning:"someone has a fortunate situation",es:"Qué suerte tienes",en_ex:"You got free tickets? Lucky you.",es_ex:"¿Conseguiste entradas gratis? Qué suerte tienes."}],common:[{id:"p_common_0",en:"Of course",meaning:"certainly or naturally",es:"Por supuesto",en_ex:"Of course I'll help.",es_ex:"Por supuesto que ayudaré."},{id:"p_common_1",en:"Exactly",meaning:"complete agreement",es:"Exactamente",en_ex:"Exactly! That's my point.",es_ex:"¡Exactamente! Ese es mi punto."},{id:"p_common_2",en:"Absolutely",meaning:"strong agreement",es:"Absolutamente",en_ex:"Absolutely.",es_ex:"Absolutamente."},{id:"p_common_3",en:"Not really",meaning:"not very much or not exactly",es:"No realmente",en_ex:"Do you like it? Not really.",es_ex:"¿Te gusta? No realmente."},{id:"p_common_4",en:"No problem",meaning:"something is not difficult or troublesome",es:"No hay problema",en_ex:"Thanks. No problem.",es_ex:"Gracias. No hay problema."}],genius:[{id:"p_genius_165",en:"The data tells a different story",meaning:"evidence suggests a conclusion different from assumptions or appearances",es:"Los datos cuentan una historia diferente",en_ex:"The data tells a different story than the initial reports.",es_ex:"Los datos cuentan una historia diferente a los informes iniciales."},{id:"p_genius_166",en:"We may be solving the wrong problem",meaning:"the current focus might not address the true issue",es:"Puede que estemos resolviendo el problema equivocado",en_ex:"We may be solving the wrong problem altogether.",es_ex:"Puede que estemos resolviendo un problema completamente distinto."},{id:"p_genius_167",en:"The evidence is inconclusive",meaning:"available information does not support a clear conclusion",es:"La evidencia no es concluyente",en_ex:"The evidence is inconclusive at this stage.",es_ex:"La evidencia no es concluyente en esta etapa."},{id:"p_genius_168",en:"Let's examine the assumptions",meaning:"carefully reviewing beliefs that may have been taken for granted",es:"Examinemos las suposiciones",en_ex:"Let's examine the assumptions behind the proposal.",es_ex:"Examinemos las suposiciones detrás de la propuesta."},{id:"p_genius_169",en:"The pattern is hard to ignore",meaning:"repeated evidence strongly suggests a trend",es:"El patrón es difícil de ignorar",en_ex:"The pattern is hard to ignore once you see it.",es_ex:"El patrón es difícil de ignorar una vez que lo ves."},{id:"p_genius_170",en:"We should distinguish signal from noise",meaning:"separating meaningful information from distractions",es:"Debemos distinguir la señal del ruido",en_ex:"We should distinguish signal from noise before reacting.",es_ex:"Debemos distinguir la señal del ruido antes de reaccionar."},{id:"p_genius_171",en:"The incentives drive the behavior",meaning:"people often act according to rewards and consequences",es:"Los incentivos impulsan el comportamiento",en_ex:"The incentives drive the behavior more than intentions do.",es_ex:"Los incentivos impulsan el comportamiento más que las intenciones."},{id:"p_genius_172",en:"Every solution creates new constraints",meaning:"fixing one problem often introduces other limitations",es:"Toda solución crea nuevas restricciones",en_ex:"Every solution creates new constraints we must manage.",es_ex:"Toda solución crea nuevas restricciones que debemos gestionar."},{id:"p_genius_173",en:"The trade-off is unavoidable",meaning:"a choice requires sacrificing one benefit for another",es:"La compensación es inevitable",en_ex:"The trade-off is unavoidable in this situation.",es_ex:"La compensación es inevitable en esta situación."},{id:"p_genius_174",en:"We should optimize for the long term",meaning:"prioritizing future benefits over immediate gains",es:"Debemos optimizar para el largo plazo",en_ex:"We should optimize for the long term rather than quick wins.",es_ex:"Debemos optimizar para el largo plazo en lugar de victorias rápidas."},{id:"p_genius_175",en:"The exception does not invalidate the rule",meaning:"rare cases do not necessarily disprove a general pattern",es:"La excepción no invalida la regla",en_ex:"The exception does not invalidate the rule.",es_ex:"La excepción no invalida la regla."},{id:"p_genius_176",en:"The burden of proof remains",meaning:"evidence is still required to support a claim",es:"La carga de la prueba permanece",en_ex:"The burden of proof remains on those making the claim.",es_ex:"La carga de la prueba sigue recayendo en quienes hacen la afirmación."},{id:"p_genius_177",en:"The conclusion may be premature",meaning:"a judgment may have been reached too early",es:"La conclusión puede ser prematura",en_ex:"The conclusion may be premature given the limited data.",es_ex:"La conclusión puede ser prematura dados los datos limitados."},{id:"p_genius_178",en:"Let's consider the counterargument",meaning:"examining the strongest opposing viewpoint",es:"Consideremos el contraargumento",en_ex:"Let's consider the counterargument before deciding.",es_ex:"Consideremos el contraargumento antes de decidir."},{id:"p_genius_179",en:"The outcome was predictable in hindsight",meaning:"an event seems obvious after it has already happened",es:"El resultado era predecible en retrospectiva",en_ex:"The outcome was predictable in hindsight.",es_ex:"El resultado era predecible en retrospectiva."},{id:"p_genius_180",en:"The complexity is often underestimated",meaning:"people frequently fail to appreciate how difficult something is",es:"La complejidad suele subestimarse",en_ex:"The complexity is often underestimated by outsiders.",es_ex:"La complejidad suele subestimarse por quienes están fuera."},{id:"p_genius_181",en:"The simplest explanation deserves consideration",meaning:"simple explanations should be evaluated before complex ones",es:"La explicación más simple merece consideración",en_ex:"The simplest explanation deserves consideration first.",es_ex:"La explicación más simple merece consideración primero."},{id:"p_genius_182",en:"We may be looking at this backwards",meaning:"the problem might require a completely different perspective",es:"Puede que estemos viendo esto al revés",en_ex:"We may be looking at this backwards.",es_ex:"Puede que estemos viendo esto al revés."},{id:"p_genius_183",en:"The numbers don't add up",meaning:"the facts appear inconsistent or suspicious",es:"Los números no cuadran",en_ex:"The numbers don't add up according to the report.",es_ex:"Los números no cuadran según el informe."},{id:"p_genius_184",en:"A useful model is not necessarily a perfect one",meaning:"something can be valuable even if it is not completely accurate",es:"Un modelo útil no necesariamente es perfecto",en_ex:"A useful model is not necessarily a perfect one.",es_ex:"Un modelo útil no necesariamente es perfecto."}],neg:[{id:"p_neg_140",en:"Let's find common ground",meaning:"trying to identify areas of agreement",es:"Busquemos puntos en común",en_ex:"Let's find common ground before discussing differences.",es_ex:"Busquemos puntos en común antes de discutir las diferencias."},{id:"p_neg_141",en:"I'm open to suggestions",meaning:"willing to consider ideas from others",es:"Estoy abierto a sugerencias",en_ex:"I'm open to suggestions if you have a better approach.",es_ex:"Estoy abierto a sugerencias si tienes un mejor enfoque."},{id:"p_neg_142",en:"Let's meet halfway",meaning:"suggesting a compromise between two positions",es:"Lleguemos a un punto medio",en_ex:"Let's meet halfway and share the costs.",es_ex:"Lleguemos a un punto medio y compartamos los costos."},{id:"p_neg_143",en:"That's a reasonable request",meaning:"acknowledging that a demand is fair",es:"Esa es una solicitud razonable",en_ex:"That's a reasonable request under the circumstances.",es_ex:"Esa es una solicitud razonable dadas las circunstancias."},{id:"p_neg_144",en:"What would you propose?",meaning:"asking someone to offer a solution or idea",es:"¿Qué propondrías?",en_ex:"What would you propose as an alternative?",es_ex:"¿Qué propondrías como alternativa?"},{id:"p_neg_145",en:"Let's explore our options",meaning:"considering multiple possible solutions",es:"Exploremos nuestras opciones",en_ex:"Let's explore our options before committing.",es_ex:"Exploremos nuestras opciones antes de comprometernos."},{id:"p_neg_146",en:"I see where you're coming from",meaning:"understanding another person's reasoning",es:"Entiendo de dónde vienes",en_ex:"I see where you're coming from, but I disagree.",es_ex:"Entiendo tu punto de vista, pero no estoy de acuerdo."},{id:"p_neg_147",en:"We may need to compromise",meaning:"both sides might need to give up something",es:"Puede que necesitemos llegar a un acuerdo",en_ex:"We may need to compromise to move forward.",es_ex:"Puede que necesitemos llegar a un acuerdo para avanzar."},{id:"p_neg_148",en:"Let's take a practical approach",meaning:"focusing on realistic actions rather than theory",es:"Tomemos un enfoque práctico",en_ex:"Let's take a practical approach to the problem.",es_ex:"Tomemos un enfoque práctico para el problema."},{id:"p_neg_149",en:"That's not negotiable",meaning:"something cannot be changed or discussed further",es:"Eso no es negociable",en_ex:"Employee safety is not negotiable.",es_ex:"La seguridad de los empleados no es negociable."},{id:"p_neg_150",en:"I appreciate your flexibility",meaning:"thanking someone for being adaptable",es:"Aprecio tu flexibilidad",en_ex:"I appreciate your flexibility during these changes.",es_ex:"Aprecio tu flexibilidad durante estos cambios."},{id:"p_neg_151",en:"Let's weigh the pros and cons",meaning:"evaluating advantages and disadvantages",es:"Evaluemos los pros y los contras",en_ex:"Let's weigh the pros and cons carefully.",es_ex:"Evaluemos cuidadosamente los pros y los contras."},{id:"p_neg_152",en:"I think we're getting closer",meaning:"progress is being made toward agreement",es:"Creo que nos estamos acercando",en_ex:"I think we're getting closer to a solution.",es_ex:"Creo que nos estamos acercando a una solución."},{id:"p_neg_153",en:"That's a deal breaker",meaning:"an issue serious enough to stop an agreement",es:"Eso rompe el acuerdo",en_ex:"For us, missing the deadline is a deal breaker.",es_ex:"Para nosotros, incumplir el plazo rompe el acuerdo."},{id:"p_neg_154",en:"Let's revisit the numbers",meaning:"reviewing financial or quantitative information again",es:"Revisemos los números nuevamente",en_ex:"Let's revisit the numbers before deciding.",es_ex:"Revisemos los números nuevamente antes de decidir."},{id:"p_neg_155",en:"We're making progress",meaning:"moving closer to a goal or agreement",es:"Estamos progresando",en_ex:"We're making progress even if it's slow.",es_ex:"Estamos progresando aunque sea lentamente."},{id:"p_neg_156",en:"I'd like to understand your concerns",meaning:"asking someone to explain their worries",es:"Me gustaría entender tus preocupaciones",en_ex:"I'd like to understand your concerns better.",es_ex:"Me gustaría entender mejor tus preocupaciones."},{id:"p_neg_157",en:"Let's focus on solutions",meaning:"concentrating on fixing problems rather than discussing them endlessly",es:"Concentrémonos en las soluciones",en_ex:"Let's focus on solutions instead of blame.",es_ex:"Concentrémonos en las soluciones en lugar de buscar culpables."},{id:"p_neg_158",en:"That's a valid point",meaning:"recognizing a strong argument",es:"Ese es un punto válido",en_ex:"That's a valid point and deserves consideration.",es_ex:"Ese es un punto válido y merece consideración."},{id:"p_neg_159",en:"Let's work toward a solution",meaning:"encouraging collaborative effort to resolve an issue",es:"Trabajemos hacia una solución",en_ex:"Let's work toward a solution that works for everyone.",es_ex:"Trabajemos juntos hacia una solución que funcione para todos."}]},st={sl_greet:[{id:"s_sl_greet_0",en:"What's up?",meaning:"casual greeting",es:"¿Qué pasa? / ¿Qué tal? / ¿Qué hubo?",en_ex:"What's up, bro? Haven't seen you in a while.",es_ex:"¿Qué pasa, bro? No te he visto en un tiempo."},{id:"s_sl_greet_1",en:"Wassup",meaning:"very casual greeting",es:"¿Qué onda? / ¿Qué hay?",en_ex:"Wassup dude, how's everything?",es_ex:"¿Qué onda causa, cómo está todo?"},{id:"s_sl_greet_2",en:"What's good?",meaning:"asking how someone is",es:"¿Qué hay de bueno? / ¿Cómo estás?",en_ex:"What's good, haven't seen you forever.",es_ex:"¿Qué hay de bueno, siglos que no te veía."},{id:"s_sl_greet_3",en:"How's it going?",meaning:"casual check-in",es:"¿Cómo te va? / ¿Cómo andas?",en_ex:"Hey, how's it going?",es_ex:"Oe, ¿cómo andas?"},{id:"s_sl_greet_4",en:"What are you up to?",meaning:"asking what someone is doing",es:"¿Qué estás haciendo? / ¿En qué andas?",en_ex:"Hey, what are you up to tonight?",es_ex:"Oe, ¿en qué andas esta noche?"},{id:"s_sl_greet_5",en:"Long time no see",meaning:"haven't seen someone in a while",es:"Cuánto tiempo / siglos sin verte",en_ex:"Long time no see! How have you been?",es_ex:"¡Siglos sin verte! ¿Cómo has estado?"},{id:"s_sl_greet_6",en:"What's new?",meaning:"asking for updates",es:"¿Qué hay de nuevo? / ¿Qué cuentas   @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100%;position:relative}
  ::-webkit-scrollbar{width:3px;height:3px}
  ::-webkit-scrollbar-track{background:#03010a}
  ::-webkit-scrollbar-thumb{background:#44406a;border-radius:2px}

  @keyframes nebula-a{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(40px,-30px) scale(1.15) rotate(8deg)}}
  @keyframes nebula-b{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(-30px,40px) scale(1.1) rotate(-6deg)}}
  @keyframes nebula-c{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,20px) scale(1.08)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes rippleOut{0%{transform:scale(0.85);opacity:0.9}100%{transform:scale(2.4);opacity:0}}
  @keyframes glowPulse{0%,100%{opacity:0.7}50%{opacity:1}}
  @keyframes flipIn{0%{transform:rotateY(-90deg);opacity:0}100%{transform:rotateY(0deg);opacity:1}}
  @keyframes rainbowShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
  @keyframes legendaryPulse{0%,100%{box-shadow:0 0 12px #FFD700,0 0 24px #FFD70050}50%{box-shadow:0 0 24px #FFD700,0 0 48px #FFD700}}
  @keyframes waveBar{0%,100%{transform:scaleY(0.25)}50%{transform:scaleY(1)}}
  @keyframes knownPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes ratePop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes chromab{0%,100%{text-shadow:none}33%{text-shadow:-3px 0 #ff00ff,3px 0 #00e5ff}66%{text-shadow:3px 0 #ff00ff,-3px 0 #00ff88}}
  @keyframes bioGlow{0%,100%{box-shadow:0 0 8px #00ff8844,0 0 16px #00ff8822}50%{box-shadow:0 0 24px #00ff8899,0 0 48px #00ff8855}}
  @keyframes starPulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(2)}}
  @keyframes recPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
  @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .lang-card{
    position:relative;
    display:flex;flex-direction:column;gap:5px;padding:14px 12px 11px;
    background:rgba(14,12,26,0.75);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(199,125,255,0.18);
    border-radius:20px;cursor:pointer;user-select:none;overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease,transform .12s ease;
    animation:fadeUp .3s ease both;
    -webkit-tap-highlight-color:transparent;
    min-height:155px;
  }
  .lang-card:hover{border-color:var(--cc);transform:translateY(-3px) scale(1.015);box-shadow:0 14px 36px rgba(0,0,0,0.6),0 0 20px var(--cc)22}
  .lang-card:active{transform:scale(0.93)}
  .lang-card.flipped{animation:flipIn .22s ease both}
  .lang-card.god-mode{animation:legendaryPulse 2s ease-in-out infinite,fadeUp .3s ease both!important;border-color:#FFD700!important}
  .lang-card.known-glow{border-color:rgba(0,255,136,0.35)!important;box-shadow:0 0 14px rgba(0,255,136,0.12)!important}
  .card-glow{position:absolute;inset:0;border-radius:19px;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,var(--cd) 0%,transparent 65%);opacity:0;transition:opacity .2s}
  .lang-card:hover .card-glow,.lang-card.flipped .card-glow{opacity:1}
  .ripple-ring{position:absolute;inset:0;border-radius:19px;border:2px solid var(--cc);pointer-events:none;animation:rippleOut .9s ease-out infinite}

  .card-action-row{display:flex;gap:4px;margin-top:auto;padding-top:6px;width:100%}
  .card-audio-btn{
    flex-shrink:0;padding:5px 8px;border-radius:8px;
    border:1px solid rgba(199,125,255,0.15);background:rgba(14,12,26,0.5);
    color:#44406a;cursor:pointer;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;min-width:32px;
  }
  .card-audio-btn.playing{border-color:var(--cc)!important;background:var(--cd)!important;color:var(--cc)!important;box-shadow:0 0 10px var(--cg)!important}
  .card-rate-btn{
    flex:1;padding:5px 3px;border-radius:8px;
    border:1px solid rgba(199,125,255,0.1);background:rgba(14,12,26,0.4);
    color:#44406a;cursor:pointer;font-size:12px;font-weight:800;
    font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;
    animation:ratePop .2s ease both;
  }
  .card-rate-btn.yes{border-color:#00FF8860!important;background:rgba(0,255,136,0.14)!important;color:#00FF88!important;box-shadow:0 0 8px rgba(0,255,136,0.25)!important}
  .card-rate-btn.no{border-color:rgba(255,0,107,0.4)!important;background:rgba(255,0,107,0.09)!important;color:#ff006b!important}

  .tab-pill{display:flex;align-items:center;gap:5px;padding:9px 15px;border-radius:50px;border:1.5px solid #27254a;background:rgba(14,12,26,0.5);color:#44406a;font-size:12.5px;font-weight:800;font-family:inherit;white-space:nowrap;cursor:pointer;transition:all .18s ease;-webkit-tap-highlight-color:transparent;outline:none}
  .tab-pill:hover:not(.active){border-color:var(--tc);color:var(--tc)}
  .tab-pill.active{background:var(--tc)22;border-color:var(--tc);color:var(--tc);box-shadow:0 0 14px var(--tg)}
  .cnt-badge{padding:1px 7px;border-radius:20px;font-size:11px;font-weight:900;background:rgba(0,0,0,0.3);transition:background .18s}
  .tab-pill.active .cnt-badge{background:rgba(255,255,255,0.2)}
  .bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 4px;font-family:inherit;transition:transform .12s;-webkit-tap-highlight-color:transparent;outline:none}
  .bottom-nav-btn:active{transform:scale(0.9)}
  .mode-toggle-btn{padding:8px 18px;border-radius:50px;border:1.5px solid #27254a;background:rgba(14,12,26,0.5);color:#44406a;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;outline:none;white-space:nowrap}
  .mode-toggle-btn.active{background:var(--mc)22;border-color:var(--mc);color:var(--mc);box-shadow:0 0 12px var(--mg)}
