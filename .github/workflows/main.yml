name: Deploy LucidLand to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: https://danniels-prime.github.io/9999/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inline JS into index.html (single-file deploy)
        run: python3 inline_build.py

      - name: Copy static files into dist
        run: |
          cp public/sw.js dist/sw.js
          cp public/manifest.json dist/manifest.json
          cp public/icon-192.png dist/icon-192.png || true
          cp public/icon-512.png dist/icon-512.png || true
          cp public/maskable-icon-512.png dist/maskable-icon-512.png || true
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Also push to Pages branch (belt + suspenders)
        run: |
          cp dist/index.html /tmp/lucid_index.html
          cp public/sw.js /tmp/lucid_sw.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/lucid-dreamland-spanish-learners-hSjDS
          git checkout claude/lucid-dreamland-spanish-learners-hSjDS
          cp /tmp/lucid_index.html index.html
          cp /tmp/lucid_sw.js sw.js
          git add index.html sw.js
          git diff --staged --quiet && echo "No changes to branch" && exit 0
          git commit -m "Auto-deploy from main @ $(git rev-parse --short ORIG_HEAD 2>/dev/null || echo latest)"
          git push origin claude/lucid-dreamland-spanish-learners-hSjDS

      - name: Deployment summary
        run: |
          echo "## ✅ LucidLand Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **[Open App → danniels-prime.github.io/9999/](https://danniels-prime.github.io/9999/)**" >> $GITHUB_STEP_SUMMARY
